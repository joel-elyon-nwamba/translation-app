<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <img class="navbar-logo" src="img/parrot.png" alt="parrot">
        <header>
            <h1 class="navbar-title">PollyGlot</h1>
            <p class="navbar-subtitle">Perfect Translation Every time</p>
        </header>
    </nav>
    <form>
        <div class="form-container">
        <h3 class="main-title">Text Translation👇🏾</h3>
        <textarea name="text" id="user-input" cols="30" rows="10" placeholder="Enter text to translate" class="text-entry"></textarea>
        
        <h3 class="main-title">Select Language👇🏾</h3>

        <div class="radio-option">
         <input type="radio" name="language" value="fr"> French <img src="img/fr-flag.png" alt="French Flag" class="flag">
         </div>
            <div class="radio-option">
            <input type="radio" name="language" value="es"> Spanish <img src="img/sp-flag.png" alt="Spanish Flag" class="flag">
            </div>
            <div class="radio-option">
            <input type="radio" name="language" value="de"> Japanese <img src="img/jpn-flag.png" alt="Japanese Flag" class="flag">
            </div>
            <div id="translator">

            </div>
              <button class="btn-translate" type="submit">Translate</button>
            </div>


    </form>
    <script src="js/index.js"></script>
    <script src="js/server.js"></script>
</body>
</html>
