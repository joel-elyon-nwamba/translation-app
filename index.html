<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <img src="img/parrot.png" alt="parrot" class="logo">
        <header>
            <h1>PollyGlot</h1>
            <p>Perfect Translation Every time</p>
        </header>
    </nav>
    <form>
        <h3>Text Translation</h3>
        <textarea name="text" id="text" cols="30" rows="10" placeholder="Enter text to translate"></textarea>
         <input type="radio" name="language" value="fr"> French <img src="img/fr-flag.png" alt="French Flag" class="flag">
            <input type="radio" name="language" value="es"> Spanish <img src="img/sp-flag.png" alt="Spanish Flag" class="flag">
            <input type="radio" name="language" value="de"> Japanese <img src="img/jpn-flag.png" alt="Japanese Flag" class="flag">
        <button type="submit">Translate</button>
    </form>
</body>
</html>
