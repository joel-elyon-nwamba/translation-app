<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <img class="navbar-logo" src="img/parrot.png" alt="Parrot mascot in the PollyGlot translation app header.">
        <header>
            <h1 class="navbar-title">PollyGlot</h1>
            <p class="navbar-subtitle">Perfect Translation Every time</p>
        </header>
    </nav>
    <form>
        <div class="form-container">
        <h3 class="main-title" id="title-transform">Text Translation👇🏾</h3>
        <textarea name="text" id="user-input" cols="30" rows="10" placeholder="Enter text to translate" class="text-entry"></textarea>
        
        <h3 class="main-title" id="title-language">Select Language👇🏾</h3>

        <div class="radio-option">
         <input  type="radio" name="language" value="fr"> French <img src="img/fr-flag.png" alt="French flag with blue, white, and red vertical stripes, beside the French language option." class="flag">
         </div>
            <div class="radio-option">
            <input type="radio" name="language" value="es"> Spanish <img src="img/sp-flag.png" alt="Spanish flag with red and yellow horizontal bands, beside the Spanish language option." class="flag">
            </div>
            <div class="radio-option">
            <input type="radio" name="language" value="ja"> Japanese <img src="img/jpn-flag.png" alt="Japanese flag with a red disc centered on a white field, beside the Japanese language option." class="flag">
            </div>
            <div id="translator">


            </div>
              <button id="btn-translate" type="submit">Translate</button>
            </div>


    </form>
    <script type="module" src="js/index.js"></script>
</body>
</html>
